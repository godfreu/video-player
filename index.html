<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <link rel="stylesheet" href="player.css">
  <script src="player.js" defer></script>
</head>
<body>
  <div class="video-container paused" data-volume-level="high">
    <img class="thumbnail-img">
    <div class="video-controls-container hideIt">
      <div class="timeline-container">
        <div class="timeline">
          <img class="preview-img">
          <div class="thumb-indicator"></div>
        </div>
      </div>
      <div class="controls">
        <button class="play-pause-btn">
          <span class="material-symbols-outlined play-icon">play_arrow</span>
          <span class="material-symbols-outlined pause-icon">pause</span>
        </button>
        <div class="volume-container">
          <button class="mute-btn">
            <span class="material-symbols-outlined volume-high-icon">volume_up</span>
            <span class="material-symbols-outlined volume-low-icon">volume_down</span>
            <span class="material-symbols-outlined volume-muted-icon">volume_off</span>
          </button>
          <input class="volume-slider" type="range" min="0" max="1" step="any" value="1">
        </div>
        <div class="duration-container">
          <div class="current-time">0:00</div>/<div class="total-time"></div>
          <button class="speed-btn wide-btn">1×</button>
        </div>
        <button class="captions-btn">
          <span class="material-symbols-outlined">subtitles</span>
        </button>
        <button class="mini-player-btn">
          <span class="material-symbols-outlined">pip</span>
        </button>
        <button class="theater-btn">
          <svg class="tall" viewBox="0 0 24 24">
            <path fill="currentColor" d="M19 6H5c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H5V8h14v8z"/>
          </svg>
          <svg class="wide" viewBox="0 0 24 24">
            <path fill="currentColor" d="M19 7H5c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm0 8H5V9h14v6z"/>
          </svg>
        </button>
        <button class="full-screen-btn">
          <span class="material-symbols-outlined open">fullscreen</span>
          <span class="material-symbols-outlined close">fullscreen_exit</span>
        </button>
      </div>
    </div>

    <!-- Video Content -->
    <video autoplay src="assets/obama.mp4">
      <track kind="captions" srclang="en" src="assets/obama.vtt">
    </video>
  </div>
</body>
</html>
